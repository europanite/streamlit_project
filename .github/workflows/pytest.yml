name: Pytest

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  tests:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: [ "3.10","3.11", "3.12", "3.13", "3.14" ]
    steps:
      - uses: actions/checkout@v7

      - name: Build test image
        run: docker compose -f docker-compose.test.yml build

      - name: Run pytest
        run: docker compose -f docker-compose.test.yml run --rm service_test
